# Bonakala Platform — Cloudflare Worker (API + Hands runtime + static web assets)
# One Worker serves the API (/api/*) and the built web app (Workers Static Assets, SPA fallback).
# Environments: default = local/preview, demo, staging, production. Secrets via `wrangler secret put`.
# The tenant-pool design (one D1 per Practice) is documented in wrangler.reference.toml and docs/16;
# this file binds one D1 database per environment, which is the pilot-tier configuration.

name = "bonakala-api"
main = "../../apps/api/src/worker.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

[placement]
mode = "smart"

[assets]
directory = "../../apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
DEMO_MODE = "true"
ANTHROPIC_MODEL = "claude-opus-5"
TIMEZONE = "Africa/Johannesburg"

[[d1_databases]]
binding = "DB"
database_name = "bonakala-local"
database_id = "local"
migrations_dir = "../../packages/db/migrations"

[[r2_buckets]]
binding = "OBJECTS"
bucket_name = "bonakala-objects-local"

[[queues.producers]]
binding = "JOBS"
queue = "bonakala-jobs"

[[queues.consumers]]
queue = "bonakala-jobs"
max_batch_size = 10
max_retries = 3

[triggers]
crons = ["*/5 * * * *"]

# ---------------------------------------------------------------------------
[env.demo]
name = "bonakala-demo"
vars = { DEMO_MODE = "true", ANTHROPIC_MODEL = "claude-opus-5", TIMEZONE = "Africa/Johannesburg" }
[[env.demo.d1_databases]]
binding = "DB"
database_name = "bonakala-demo"
database_id = "276eddfa-a393-43b0-9f8e-dd9c8dacb952"
migrations_dir = "../../packages/db/migrations"
[[env.demo.r2_buckets]]
binding = "OBJECTS"
bucket_name = "bonakala-objects-demo"
[[env.demo.queues.producers]]
binding = "JOBS"
queue = "bonakala-jobs-demo"
[[env.demo.queues.consumers]]
queue = "bonakala-jobs-demo"
[env.demo.triggers]
crons = ["*/5 * * * *"]

[env.staging]
name = "bonakala-staging"
vars = { DEMO_MODE = "false", ANTHROPIC_MODEL = "claude-opus-5", TIMEZONE = "Africa/Johannesburg" }
[[env.staging.d1_databases]]
binding = "DB"
database_name = "bonakala-staging"
database_id = "<D1_ID_STAGING>"
migrations_dir = "../../packages/db/migrations"
[[env.staging.r2_buckets]]
binding = "OBJECTS"
bucket_name = "bonakala-objects-staging"
[[env.staging.queues.producers]]
binding = "JOBS"
queue = "bonakala-jobs-staging"
[[env.staging.queues.consumers]]
queue = "bonakala-jobs-staging"
[env.staging.triggers]
crons = ["*/5 * * * *"]

[env.production]
name = "bonakala-production"
vars = { DEMO_MODE = "false", ANTHROPIC_MODEL = "claude-opus-5", TIMEZONE = "Africa/Johannesburg" }
# Production: identified data. Enable Regional Services / R2 jurisdiction where available (docs/16 §3).
[[env.production.d1_databases]]
binding = "DB"
database_name = "bonakala-production"
database_id = "<D1_ID_PRODUCTION>"
migrations_dir = "../../packages/db/migrations"
[[env.production.r2_buckets]]
binding = "OBJECTS"
bucket_name = "bonakala-objects-production"
[[env.production.queues.producers]]
binding = "JOBS"
queue = "bonakala-jobs-production"
[[env.production.queues.consumers]]
queue = "bonakala-jobs-production"
[env.production.triggers]
crons = ["*/5 * * * *"]
