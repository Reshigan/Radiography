# =============================================================================
# Bonakala Platform - Cloudflare - API Worker (apps/api)
# -----------------------------------------------------------------------------
# REFERENCE SKELETON. Binding ids, routes, account ids and database ids are
# placeholders to be completed during the build.
# See docs/16-deployment-cloudflare-demo.md (Cloud Deployment on Cloudflare).
#
# One wrangler.toml per Worker app; this is the canonical example for apps/api.
# apps/agents, apps/whatsapp, apps/inference and apps/sim follow the same
# pattern with fewer bindings. Environments:
#   (default)   preview, per pull request, in the demo account
#   staging     bonakala-staging account, synthetic data
#   demo        bonakala-demo account, synthetic data + partner sandboxes
#   production  bonakala-prod account, identified data (see 16 section 3)
#
# Secrets are NEVER in this file. Set per environment with:
#   wrangler secret put <NAME> --env <staging|demo|production>
# Required secrets:
#   ANTHROPIC_API_KEY      Claude API key (or AI Gateway authenticated token)
#   AI_GATEWAY_URL         https://gateway.ai.cloudflare.com/v1/<account>/<gateway>/anthropic
#   WHATSAPP_TOKEN, WHATSAPP_VERIFY_TOKEN, WHATSAPP_APP_SECRET
#   ACCESS_AUD             Cloudflare Access application audience tag
#   SESSION_SIGNING_KEY    HMAC key for session cookies
#   TURNSTILE_SECRET       Turnstile server-side secret
#   TENANT_KEK_REF         key-encryption key reference (envelope encryption)
#   SWITCH_CLIENT_CERT, PSP_API_KEY, SMS_API_KEY      (production/staging only)
#   SIM_WEBHOOK_SECRET                                (demo/staging only)
#
# Times in [triggers] are UTC. SAST = UTC+2, no DST.
# D1 tenant pool: one database per Practice tenant (DB_T001...). The tenant
# directory maps practice_id -> binding name. Extend the pool by config deploy.
# =============================================================================

name = "bonakala-api-preview"
main = "../../apps/api/src/worker.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
account_id = "<CF_ACCOUNT_ID_DEMO>"

[observability]
enabled = true

[placement]
mode = "smart"

# --- Plain (non-secret) configuration ---------------------------------------
[vars]
BONAKALA_ENV = "preview"
BONAKALA_LABEL = "DEMO"                 # "" in production; rendered on every surface otherwise
TIMEZONE = "Africa/Johannesburg"
RESIDENCY_POSTURE = "none"              # none | regional-services | jurisdiction-r2 | both
HAND_DAILY_BUDGET_ZAR = "150"           # illustrative leash on LLM spend per tenant
EGRESS_ALLOWLIST = "gateway.ai.cloudflare.com,graph.facebook.com"
AI_GATEWAY_ID = "bonakala-preview"

# --- D1: tenant directory + per-tenant pool ---------------------------------
[[d1_databases]]
binding = "DIRECTORY"
database_name = "bonakala-preview-directory"
database_id = "<D1_ID_PREVIEW_DIRECTORY>"
migrations_dir = "../../packages/db/migrations/d1-directory"

[[d1_databases]]
binding = "DB_T001"
database_name = "bonakala-preview-t001"
database_id = "<D1_ID_PREVIEW_T001>"
migrations_dir = "../../packages/db/migrations/d1"

[[d1_databases]]
binding = "DB_T002"
database_name = "bonakala-preview-t002"
database_id = "<D1_ID_PREVIEW_T002>"
migrations_dir = "../../packages/db/migrations/d1"

# --- R2: imaging tiers, documents, exports, logs ----------------------------
[[r2_buckets]]
binding = "IMAGING_HOT"
bucket_name = "bonakala-preview-imaging-hot"

[[r2_buckets]]
binding = "IMAGING_COLD"                # lifecycle target after 18 months (rule set outside this file)
bucket_name = "bonakala-preview-imaging-cold"

[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "bonakala-preview-documents"

[[r2_buckets]]
binding = "EXPORTS"                     # D1 exports, DR copies (replicated to a second jurisdiction)
bucket_name = "bonakala-preview-exports"

# --- KV ---------------------------------------------------------------------
[[kv_namespaces]]
binding = "SESSIONS"
id = "<KV_ID_PREVIEW_SESSIONS>"

[[kv_namespaces]]
binding = "FLAGS"
id = "<KV_ID_PREVIEW_FLAGS>"

[[kv_namespaces]]
binding = "REFDATA"                     # tenant directory cache, tariff codes, scheme rule packs, ICD-10 subset
id = "<KV_ID_PREVIEW_REFDATA>"

# --- Queues: producers ------------------------------------------------------
[[queues.producers]]
binding = "EVENTS"
queue = "bonakala-preview-events"

[[queues.producers]]
binding = "INFERENCE"
queue = "bonakala-preview-inference"

[[queues.producers]]
binding = "CLAIMS"
queue = "bonakala-preview-claims"

[[queues.producers]]
binding = "NOTIFICATIONS"
queue = "bonakala-preview-notifications"

[[queues.producers]]
binding = "AGENTS"
queue = "bonakala-preview-agents"

# --- Queues: consumers (projections + Pipelines ingestion) ------------------
[[queues.consumers]]
queue = "bonakala-preview-events"
max_batch_size = 50
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "bonakala-preview-events-dlq"

# --- Durable Objects (SQLite-backed) ----------------------------------------
[durable_objects]
bindings = [
  { name = "SLOT_HOLD",        class_name = "SlotHold" },        # booking holds with alarms
  { name = "WORKLIST_LOCK",    class_name = "WorklistLock" },    # radiologist claim semantics
  { name = "TENANT_WRITER",    class_name = "TenantWriter" },    # per-tenant write batching, reset flag
  { name = "CRITICAL_FINDING", class_name = "CriticalFinding" }, # acknowledgement state machine
  { name = "CONTAINER_HOST",   class_name = "ContainerHost" },   # starts/stops compute containers
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SlotHold", "WorklistLock", "TenantWriter", "CriticalFinding", "ContainerHost"]

# --- Workflows: long-running processes and Hands ----------------------------
[[workflows]]
binding = "HAND_RUN"
name = "bonakala-preview-hand-run"
class_name = "HandRunWorkflow"

[[workflows]]
binding = "CLAIMS_RUN"
name = "bonakala-preview-claims-run"
class_name = "ClaimsRunWorkflow"

[[workflows]]
binding = "MONTH_END"
name = "bonakala-preview-month-end"
class_name = "MonthEndWorkflow"

[[workflows]]
binding = "PRACTICE_ONBOARD"
name = "bonakala-preview-practice-onboard"
class_name = "PracticeOnboardWorkflow"

[[workflows]]
binding = "RETENTION_SWEEP"
name = "bonakala-preview-retention-sweep"
class_name = "RetentionSweepWorkflow"

[[workflows]]
binding = "DR_EXPORT"
name = "bonakala-preview-dr-export"
class_name = "DrExportWorkflow"

# --- Containers: heavy compute (DICOM parsing, de-identification, ONNX, exports)
# GPU availability on Containers must be verified; CPU-only models here today.
[[containers]]
class_name = "ContainerHost"
image = "../../apps/inference/Dockerfile"
max_instances = 2
instance_type = "standard"

# --- Workers AI (utility tasks; routed through AI Gateway by the adapter) ---
[ai]
binding = "AI"

# --- Vectorize --------------------------------------------------------------
[[vectorize]]
binding = "SEARCH"
index_name = "bonakala-preview-search"

# --- Analytics Engine + Pipelines (events -> R2 Data Catalog / Iceberg) -----
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "bonakala_preview_analytics"

[[pipelines]]
binding = "PIPELINE"
pipeline = "bonakala-preview-events"

# --- Browser Rendering (PDF reports and statements) -------------------------
[browser]
binding = "BROWSER"

# --- Images (thumbnails, key images) ----------------------------------------
[images]
binding = "IMAGES"

# --- Email Workers (outbound; inbound routing configured at zone level) -----
[[send_email]]
name = "EMAIL"
destination_address = "noreply@demo.bonakala.example"

# --- Service bindings: simulator (demo/staging) and inference Worker --------
[[services]]
binding = "SIM"
service = "bonakala-sim-preview"

[[services]]
binding = "INFERENCE_SVC"
service = "bonakala-inference-preview"

# --- Cron Triggers (UTC). */5: reminders + hold sweep; hourly: claims run,
#     dunning; 00:00 UTC (02:00 SAST): retention, DR export, analytics roll-up;
#     01:00 UTC on the 1st (03:00 SAST): month-end close proposal.
[triggers]
crons = ["*/5 * * * *", "0 * * * *", "0 0 * * *", "0 1 1 * *"]

