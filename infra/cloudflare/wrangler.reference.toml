[[env.production.vectorize]]
binding = "SEARCH"
index_name = "bonakala-search"

[[env.production.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "bonakala_analytics"

[[env.production.pipelines]]
binding = "PIPELINE"
pipeline = "bonakala-events"

[env.production.browser]
binding = "BROWSER"

[env.production.images]
binding = "IMAGES"

[[env.production.send_email]]
name = "EMAIL"
destination_address = "noreply@bonakala.example"

[[env.production.services]]
binding = "INFERENCE_SVC"
service = "bonakala-inference"

[env.production.triggers]
crons = ["*/5 * * * *", "0 * * * *", "0 0 * * *", "0 1 1 * *"]
