# =============================================================================
# Bonakala Platform - internal single-node PILOT profile
# -----------------------------------------------------------------------------
# REFERENCE SKELETON to be completed during the build.
# See docs/17-deployment-docker-internal.md (sections 3, 4, 8, 11).
#
# Usage:
#   cp .env.example .env            # then fill in values (generate from SOPS in real use)
#   docker compose up -d            # core services
#   docker compose --profile gpu up -d inference   # GPU inference (optional)
#   docker compose --profile observability up -d   # prometheus/grafana/loki/tempo
#
# Licensing: orthanc (GPLv3), minio (AGPLv3), grafana/loki/tempo (AGPLv3) run as
# separate, unmodified containers reached over the network. Images are pinned by
# tag here and MUST be pinned by digest for a release (see 17 section 13).
# =============================================================================

name: bonakala

x-logging: &default-logging
  driver: json-file
  options: { max-size: "50m", max-file: "5" }

x-otel: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_SERVICE_NAMESPACE: bonakala
  TZ: Africa/Johannesburg

networks:
  frontend:      # caddy, web, api, whatsapp
  backend:       # data services; no external access
    internal: true
  ai:            # inference and vendor models
    internal: true
  observability:

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  valkey_data:
  nats_data:
  minio_data:
  meili_data:
  orthanc_data:
  keycloak_data:
  model_cache:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
  backup_repo:

services:
  # ---------------------------------------------------------------------------
  # Edge / TLS
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      PLATFORM_HOST: ${PLATFORM_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    networks: [frontend, observability]
    depends_on: [web, api, whatsapp, keycloak]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Application
  # ---------------------------------------------------------------------------
  web:
    image: ${REGISTRY}/bonakala/web:${BONAKALA_VERSION}
    restart: unless-stopped
    environment:
      API_BASE_URL: https://${PLATFORM_HOST}/api
      OIDC_ISSUER: https://${PLATFORM_HOST}/auth/realms/bonakala
    networks: [frontend]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  api:
    image: ${REGISTRY}/bonakala/api:${BONAKALA_VERSION}
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *otel-env
      BONAKALA_ENV: internal
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      VALKEY_URL: redis://valkey:6379
      NATS_URL: nats://nats:4222
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      ORTHANC_URL: http://orthanc-central:8042
      ORTHANC_USER: ${ORTHANC_USER}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD}
      INFERENCE_URL: http://inference:8000
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL}
      OIDC_ISSUER: http://keycloak:8080/realms/bonakala
      OIDC_PUBLIC_ISSUER: https://${PLATFORM_HOST}/auth/realms/bonakala
    networks: [frontend, backend, ai, observability]
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      nats: { condition: service_healthy }
      minio: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

  agents:
    image: ${REGISTRY}/bonakala/agents:${BONAKALA_VERSION}
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *otel-env
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NATS_URL: nats://nats:4222
      VALKEY_URL: redis://valkey:6379
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL}     # only egress path to the Claude API (17 section 12)
      HAND_DAILY_BUDGET_ZAR: ${HAND_DAILY_BUDGET_ZAR}
    networks: [backend, observability]
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  whatsapp:
    image: ${REGISTRY}/bonakala/whatsapp:${BONAKALA_VERSION}
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *otel-env
      API_URL: http://api:3000
      NATS_URL: nats://nats:4222
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
    networks: [frontend, backend, observability]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  scheduler:
    # Publishes scheduled jobs to NATS (reminders, claims runs, dunning, month-end,
    # retention). Leader election via Postgres advisory lock so replicas are safe.
    image: ${REGISTRY}/bonakala/scheduler:${BONAKALA_VERSION}
    restart: unless-stopped
    environment:
      <<: *otel-env
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NATS_URL: nats://nats:4222
    networks: [backend, observability]
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Clinical Intelligence (BCI) - GPU optional profile
  # ---------------------------------------------------------------------------
  inference:
    image: ${REGISTRY}/bonakala/inference:${BONAKALA_VERSION}
    profiles: [gpu]
    restart: unless-stopped
    environment:
      <<: *otel-env
      NATS_URL: nats://nats:4222
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      ORTHANC_URL: http://orthanc-central:8042
      MODEL_REGISTRY_URL: http://api:3000/internal/bci/registry
      ONNX_PROVIDERS: CUDAExecutionProvider,CPUExecutionProvider
    volumes:
      - model_cache:/models
    networks: [backend, ai, observability]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Data services (backend network only)
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16      # Postgres 16 + pgvector; add pg_partman in the build image
    restart: unless-stopped
    command: >
      postgres -c wal_level=replica -c archive_mode=on
               -c archive_command='pgbackrest --stanza=bonakala archive-push %p'
               -c max_connections=300 -c shared_buffers=${PG_SHARED_BUFFERS}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Africa/Johannesburg
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro   # extensions, RLS roles, keycloak/orthanc DBs
      - backup_repo:/var/lib/pgbackrest
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    volumes: [valkey_data:/data]
    networks: [backend]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

  nats:
    image: nats:2
    restart: unless-stopped
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    volumes: [nats_data:/data]
    networks: [backend, observability]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

  minio:
    # AGPLv3 - unmodified, separate service. Alternative: chrislusf/seaweedfs (Apache-2.0).
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [minio_data:/data]
    networks: [backend]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

  minio-init:
    # Creates buckets with versioning + object lock (imaging, documents, backups, logs).
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
        for b in imaging-warm imaging-cold documents backups logs; do
          mc mb --ignore-existing --with-lock local/$$b && mc version enable local/$$b;
        done
    networks: [backend]

  meilisearch:
    image: getmeili/meilisearch:v1
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes: [meili_data:/meili_data]
    networks: [backend]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

  orthanc-central:
    # GPLv3 - separate process; reached via REST/DICOMweb only. Source offered (17 section 13).
    image: jodogne/orthanc-plugins:1.12.4
    restart: unless-stopped
    ports:
      - "4242:4242"     # DICOM (from Edge Gateways over the site tunnel only; firewall accordingly)
    environment:
      ORTHANC__POSTGRESQL__HOST: postgres
      ORTHANC__POSTGRESQL__DATABASE: orthanc
      ORTHANC__POSTGRESQL__USERNAME: ${POSTGRES_USER}
      ORTHANC__POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      ORTHANC__REGISTERED_USERS: '{"${ORTHANC_USER}": "${ORTHANC_PASSWORD}"}'
      ORTHANC__AWS_S3_STORAGE__BUCKET_NAME: imaging-warm
      ORTHANC__AWS_S3_STORAGE__ENDPOINT: http://minio:9000
      ORTHANC__AWS_S3_STORAGE__ACCESS_KEY: ${MINIO_ROOT_USER}
      ORTHANC__AWS_S3_STORAGE__SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      TZ: Africa/Johannesburg
    volumes:
      - ./orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - orthanc_data:/var/lib/orthanc/db
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u ${ORTHANC_USER}:${ORTHANC_PASSWORD} http://localhost:8042/system"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *default-logging

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start", "--import-realm", "--http-relative-path=/auth", "--proxy-headers=xforwarded", "--hostname=https://${PLATFORM_HOST}/auth"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/realm-bonakala.json:/opt/keycloak/data/import/realm-bonakala.json:ro
      - keycloak_data:/opt/keycloak/data
    networks: [frontend, backend]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 30s
      timeout: 10s
      retries: 10
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Backup agent: pgbackrest PITR + object replication to off-site bucket
  # ---------------------------------------------------------------------------
  backup-agent:
    image: ${REGISTRY}/bonakala/backup:${BONAKALA_VERSION}
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGBACKREST_STANZA: bonakala
      OFFSITE_S3_ENDPOINT: ${OFFSITE_S3_ENDPOINT}
      OFFSITE_S3_ACCESS_KEY: ${OFFSITE_S3_ACCESS_KEY}
      OFFSITE_S3_SECRET_KEY: ${OFFSITE_S3_SECRET_KEY}
      BACKUP_SCHEDULE_FULL: "0 1 * * 0"       # Sunday 01:00 SAST
      BACKUP_SCHEDULE_DIFF: "0 1 * * 1-6"
      TZ: Africa/Johannesburg
    volumes:
      - backup_repo:/var/lib/pgbackrest
    networks: [backend, observability]
    depends_on:
      postgres: { condition: service_healthy }
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Observability (profile: observability). Grafana/Loki/Tempo are AGPLv3, unmodified.
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes: [./observability/otel-collector.yaml:/etc/otel/config.yaml:ro]
    networks: [observability, backend]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:13133/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  prometheus:
    image: prom/prometheus:latest
    profiles: [observability]
    restart: unless-stopped
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    networks: [observability]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  grafana:
    image: grafana/grafana:latest
    profiles: [observability]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${PLATFORM_HOST}/grafana
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"   # OIDC to Keycloak; complete in provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [observability, frontend]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  loki:
    image: grafana/loki:latest
    profiles: [observability]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks: [observability]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  tempo:
    image: grafana/tempo:latest
    profiles: [observability]
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    networks: [observability]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3200/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
