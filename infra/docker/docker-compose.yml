# Bonakala — internal / self-hosted pilot stack (ADR-001, ADR-002).
# Build from the repository root:  docker compose -f infra/docker/docker-compose.yml up --build
# The reference topology with Postgres, NATS, MinIO, Orthanc and observability is in docker-compose.reference.yml.
name: bonakala
services:
  api:
    build: { context: ../.., dockerfile: infra/docker/Dockerfile.api }
    environment:
      DEMO_MODE: ${DEMO_MODE:-true}
      DATABASE_URL: file:/data/bonakala.db
      OBJECT_STORE_DIR: /data/objects
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      TZ: Africa/Johannesburg
    volumes:
      - api-data:/data
    ports:
      - "8787:8787"
    restart: unless-stopped
  web:
    build: { context: ../.., dockerfile: infra/docker/Dockerfile.web }
    depends_on: [api]
    ports:
      - "8080:80"
    restart: unless-stopped
  # Optional on-site DICOM node (GPLv3, separate process; see docs/17 and infra/edge-gateway).
  orthanc:
    image: jodogne/orthanc-plugins:1.12.4
    profiles: ["dicom"]
    volumes:
      - ./orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - orthanc-data:/var/lib/orthanc/db
    ports:
      - "4242:4242"
      - "8042:8042"
    restart: unless-stopped
volumes:
  api-data:
  orthanc-data:
