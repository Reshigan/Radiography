name: ci
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

env:
  PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright

jobs:
  verify:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @bonakala/web build
      - name: Worker bundle dry run
        run: pnpm --filter @bonakala/api exec wrangler deploy --dry-run --outdir /tmp/worker --config ../../infra/cloudflare/wrangler.toml
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: apps/web/dist }

  e2e:
    name: e2e smoke (Playwright)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bonakala/web exec playwright install --with-deps chromium
      - run: pnpm --filter @bonakala/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/playwright-report }

  deploy-demo:
    name: deploy demo (Cloudflare)
    if: github.ref == 'refs/heads/main'
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bonakala/web build
      - name: Apply D1 migrations and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd apps/api
          npx wrangler d1 migrations apply bonakala-demo --env demo --remote --config ../../infra/cloudflare/wrangler.toml
          npx wrangler deploy --env demo --config ../../infra/cloudflare/wrangler.toml
