<!doctype html>
<html lang="en-ZA" data-lens="patient">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patient Space — Bonakala</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../bdl.css">
<style>
body{padding:14px 16px 24px}
.page-hd{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 6px}
.page-hd h1{font-size:20px}.page-hd .muted{font-size:13px}
.phones{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding:0;align-items:start}
.phones>figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.phones figcaption{font-size:12px;color:var(--text-2);text-align:center}
.phone{width:100%;max-width:346px;height:812px;min-height:0;margin:0 auto;font-size:14px;--u:6px;--row:48px}
.phone .ph-hd{padding:8px 16px 6px}
.phone .ph-hd h2{font-size:19px}
.phone .body{padding:0 14px 12px;gap:10px;overflow:hidden}
.phone .card{padding:12px}
.phone .card h3{font-size:15px;margin-bottom:6px}
.phone .nav a{padding:9px 0 10px;font-size:10.5px}
.phone .nav a svg{display:block;margin:0 auto 2px;width:18px;height:18px}
.phone .status .cell{display:flex;gap:4px;align-items:center}
.phone .btn.lg{height:48px;font-size:15px;border-radius:6px}
.phone .btn{border-radius:6px}
.avatar-sm{width:34px;height:34px;border-radius:50%;background:var(--marrow);color:#fff;font:600 12px var(--display);display:flex;align-items:center;justify-content:center;flex:none}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qa a{border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:10px 10px;display:flex;flex-direction:column;gap:4px;color:var(--text);min-height:64px}
.qa a svg{width:20px;height:20px;color:var(--primary)}
.qa a b{font-weight:600;font-size:14px}.qa a span{font-size:11.5px;color:var(--text-2)}
.lang{display:flex;gap:6px;flex-wrap:wrap}
.lang span{border:1px solid var(--line-strong);border-radius:14px;padding:3px 10px;font-size:12px;background:var(--surface-2)}
.lang span.on{background:var(--primary);color:var(--primary-label);border-color:transparent}
.bring{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.bring li{display:flex;gap:8px;align-items:center}.bring li i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ok);display:inline-block;flex:none;position:relative}
.bring li i::after{content:"";position:absolute;left:5px;top:2px;width:3px;height:7px;border:solid var(--ok);border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.live{display:flex;align-items:center;gap:8px;background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:8px 10px;font-size:13px;font-weight:500}
.live i{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.slots{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);overflow:hidden}
.slot{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);min-height:56px}
.slot:last-child{border-bottom:none}
.slot.on{background:var(--ok-bg)}
.slot .r{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-strong);background:var(--surface-2);position:relative}
.slot.on .r{border-color:var(--primary)}.slot.on .r::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--primary)}
.slot .t{font-weight:600;font-size:14px}.slot .s{font-size:12px;color:var(--text-2)}
.slot .d{font-family:var(--mono);font-size:12px;color:var(--text-2);text-align:right}
.price{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px}
.price .money{font-size:13px}.price .big{font:600 22px/1.1 var(--display);color:var(--heading)}
.price .lbl{color:var(--text-2)}
.price .tot{border-top:1px solid var(--line);padding-top:6px;font-weight:600;color:var(--heading)}
.q{display:flex;flex-direction:column;gap:5px}
.q .ql{font-size:13px;font-weight:500}
.rc{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rc span{height:40px;border:1px solid var(--line-strong);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--surface-2)}
.rc span.on{border-color:var(--primary);background:var(--ok-bg);color:var(--ok);font-weight:600;box-shadow:inset 0 0 0 1px var(--primary)}
.rc span.att{border-color:var(--warn);color:var(--warn);background:var(--warn-bg);font-weight:600}
.sig{height:64px;border:1px dashed var(--line-strong);border-radius:6px;background:var(--surface);position:relative}
.sig svg{position:absolute;inset:0;width:100%;height:100%}
.sig small{position:absolute;right:8px;bottom:4px;font:10px var(--mono);color:var(--text-2)}
.paym{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.paym span{height:44px;border:1px solid var(--line-strong);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;background:var(--surface-2)}
.paym span.on{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);color:var(--ok)}
.tog{display:flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;font-size:12.5px}
.tog span{flex:1;text-align:center;padding:8px 6px;color:var(--text-2)}
.tog span.on{background:var(--primary);color:var(--primary-label);font-weight:600}
.keyimg{display:grid;grid-template-columns:88px 1fr;gap:10px;align-items:center}
.keyimg .im{width:88px;height:88px;border-radius:6px;background:radial-gradient(ellipse at 50% 50%,#3a3e41 0%,#1d2022 55%,#000 85%);border:1px solid var(--line);position:relative;overflow:hidden}
.keyimg .im::after{content:"";position:absolute;left:22%;top:16%;width:56%;height:66%;border-radius:50% 50% 45% 45%;background:radial-gradient(ellipse at 50% 45%,#6b6f72 0%,#3a3e41 60%,transparent 75%);opacity:.8}
.keyimg .im span{position:absolute;bottom:3px;left:5px;font:10px var(--mono);color:#aaa}
.plain{font-size:14px;line-height:1.5}
.zu{font-size:12px;color:var(--text-2)}.zu b{color:var(--text);font-weight:500}
.remind{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.remind .cal{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:6px;overflow:hidden;width:48px;font-size:11px;background:var(--surface-2);grid-template-columns:none}
.remind .cal b{display:block;width:100%;text-align:center;background:var(--primary);color:var(--primary-label);font:600 10px var(--display);padding:2px 0;letter-spacing:.04em}
.remind .cal span{font:600 18px/1.2 var(--display);color:var(--heading);padding:4px 0 3px}
@media (max-width:1100px){.phones{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.phones{grid-template-columns:1fr}.phone{max-width:100%}}
</style>
</head>

        <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h6M9 16h6"/></svg>Results</a>

  <!-- (d) Results -->
